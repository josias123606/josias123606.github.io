---
layout: default
---

<article class="blog-post" data-categories="{{ page.categories | join: ', ' }}">
    <h2>{{ page.title }}</h2>
    <div class="blog-post-meta">
        <span>{{ page.date | date: "%d de %B, %Y" }}</span>
        {% if page.categories %}
            {% for category in page.categories %}
                <span class="blog-post-category">{{ category }}</span>
            {% endfor %}
        {% endif %}
    </div>
    
    <div style="margin-top: 20px;">
        <a href="/blog" style="color: #888; text-decoration: none; font-size: 12px; font-weight: 500;">← Volver al blog</a>
    </div>
    
    {{ content }}
</article>
